<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Villa CABOUA</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<header class="hero">
  <div class="hero-overlay">
    <h1>Villa CABOUA</h1>
    <p>Location en Guadeloupe</p>
  </div>
</header>

<div class="container">

  <!-- GALERIE -->
  <section class="card">
    <h2>Galerie</h2>
    <div class="gallery">
      <img src="images/salon.jpeg">
      <img src="images/cuisine.jpeg">
      <img src="images/chambre1.jpeg">
      <img src="images/chambre2.jpeg">
      <img src="images/terrasse.jpeg">
      <img src="images/sb1.jpeg">
    </div>
  </section>

  <!-- EQUIPEMENTS -->
  <section class="card">
    <h2>Équipements</h2>
    <div class="equipments">
      <div><i class="fa fa-wifi"></i> Wifi</div>
      <div><i class="fa fa-snowflake"></i> Climatisation</div>
      <div><i class="fa fa-car"></i> Parking</div>
      <div><i class="fa fa-tv"></i> TV</div>
    </div>
  </section>

  <!-- DISPONIBILITES -->
  <section class="card" id="disponibilites">
    <h2>Disponibilités</h2>

    <iframe
      class="calendar-iframe"
      src="https://calendar.google.com/calendar/embed?src=ds98qjiuc1uqumr9dc1nnaoag24pqfsa%40import.calendar.google.com&ctz=America%2FGuadeloupe">
    </iframe>

    <div id="calendar"></div>

    <div class="booking">

      <div class="row">
        <div>
          <label>Adultes</label>
          <div class="counter">
            <button id="adultMinus">-</button>
            <span id="adultCount">2</span>
            <button id="adultPlus">+</button>
          </div>
        </div>

        <div>
          <label>Enfants</label>
          <div class="counter">
            <button id="childMinus">-</button>
            <span id="childCount">0</span>
            <button id="childPlus">+</button>
          </div>
        </div>
      </div>

      <div id="billing" class="billing"></div>

      <button id="checkoutButton" class="btn">Réserver</button>

    </div>

  </section>

</div>

<!-- WHATSAPP -->
<a href="https://wa.me/590690000000" class="whatsapp">
<i class="fa-brands fa-whatsapp"></i>
</a>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/fr.js"></script>

<script src="js/main.js"></script>

</body>
</html>
