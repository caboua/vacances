<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Villa CABOUA – Location en Guadeloupe</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<header>
  <div class="hero-content">
    <h1>Villa CABOUA</h1>
    <p>Location villa en Guadeloupe – Jusqu'à 8 voyageurs</p>
    <a href="#disponibilites" class="hero-btn">Vérifier les disponibilités</a>
  </div>
</header>

<div class="container">
<div class="left">

<!-- Description -->
<div class="section">
<h2>Description</h2>
<p>Villa moderne située en Guadeloupe, idéale pour un séjour en famille.</p>
<ul>
<li>1 Suite parentale</li>
<li>2 chambres climatisées</li>
<li>Terrasse et jardin tropical</li>
</ul>
</div>

<!-- Galerie -->
<div class="section">
<h2>Galerie</h2>
<div class="gallery">
<img src="images/salon.jpeg">
<img src="images/cuisine.jpeg">
<img src="images/chambre1.jpeg">
<img src="images/chambre2.jpeg">
</div>
</div>

<!-- Disponibilités -->
<div class="section" id="disponibilites">
<h2>Disponibilités</h2>

<div class="calendar-wrapper">
<iframe
src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=America%2FNew_York&showPrint=0&src=dmlsbGEuY2Fib3VhQGdtYWlsLmNvbQ&src=YTQyNjgyODkxZmYzY2RlYmE3ZThkMzBjOGRlYjcxY2QzZTI2M2FhZjlkM2Q4NGI2MWNjNGVmYjUyZjVhMmM3NUBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&src=ZHM5OHFqaXVjMXVxdW1yOWRjMW5uYW9hZzI0cHFmc2FAaW1wb3J0LmNhbGVuZGFyLmdvb2dsZS5jb20&color=%23710076&color=%23d50000&color=%23009688"
frameborder="0"
scrolling="no">
</iframe>
</div>

<div class="booking-box">

<label>Dates</label>
<input id="calendar" placeholder="Choisir vos dates">

<div id="billing"></div>

<label>Adultes</label>
<div class="counter">
<button id="adultMinus">−</button>
<span id="adultCount">2</span>
<button id="adultPlus">+</button>
</div>

<label>Enfants</label>
<div class="counter">
<button id="childMinus">−</button>
<span id="childCount">0</span>
<button id="childPlus">+</button>
</div>

<button id="checkoutButton">Réserver</button>

</div>
</div>

</div>
</div>

<!-- Modal -->
<div id="reservationModal" class="modal">
<div class="modal-content">
<span class="close">&times;</span>
<p id="reservationSummary"></p>
<button id="confirmBooking">Confirmer</button>
</div>
</div>

<a href="#" id="whatsappFloat" class="whatsapp-float">
<i class="fa-brands fa-whatsapp"></i>
</a>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="js/main.js"></script>

</body>
</html>
