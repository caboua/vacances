<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Villa CABOUA – Location en Guadeloupe</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<header>
  <div class="hero-content">
    <h1>Villa CABOUA</h1>
    <p>Location villa en Guadeloupe – Jusqu'à 8 voyageurs</p>
  </div>
</header>

<div class="container">

<div class="left">

<div class="section">
<h2>Description</h2>
<p>Villa moderne avec terrasse et jardin tropical.</p>
</div>

<div class="section">
<h2>Disponibilités</h2>

<!-- CALENDRIER -->
<div id="calendar"></div>

<!-- BOOKING PANEL -->
<div class="booking-box">

<label>Adultes</label>
<div class="counter">
<button id="adultMinus">−</button>
<span id="adultCount">2</span>
<button id="adultPlus">+</button>
</div>

<label>Enfants</label>
<div class="counter">
<button id="childMinus">−</button>
<span id="childCount">0</span>
<button id="childPlus">+</button>
</div>

<div id="billing"></div>

<button id="checkoutButton">Réserver</button>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/fr.js"></script>
<script src="js/main.js"></script>

</body>
</html>
