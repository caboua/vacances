<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Villa CABOUA – Location en Guadeloupe</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  font-family: Arial, sans-serif;
  padding: 20px;
}

.reservation-section {
  max-width: 800px;
  margin: 0 auto;
}

.calendar-iframe {
  width: 100%;
  max-width: 100%;
  height: 400px;
  border: 1px solid #ccc;
  border-radius: 8px;
  margin-bottom: 15px;
}

.date-input-wrapper input {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
  background-color: #f9f9f9;
}

.counter {
  display: flex;
  align-items: center;
  gap: 10px;
}

.counter button {
  width: 30px;
  height: 30px;
}

.billing-line {
  display: flex;
  justify-content: space-between;
}

.billing-line.total {
  font-weight: bold;
  margin-top: 5px;
}

@media (max-width: 768px) {
  #calendar {
    pointer-events: none; /* interdit la saisie sur mobile */
  }
}
</style>
</head>

<body>

<h1>Villa CABOUA</h1>
<p>Location villa en Guadeloupe – Jusqu'à 8 voyageurs</p>

<div class="reservation-section">
  <h2>Disponibilités</h2>

  <!-- Iframe Google Calendar -->
  <iframe
    src="https://calendar.google.com/calendar/embed?src=a42682891ff3cdeba7e8d30c8deb71cd3e263aaf9d3d84b61cc4efb52f5a2c75%40group.calendar.google.com&ctz=America%2FGuadeloupe"
    class="calendar-iframe"
    frameborder="0"
    scrolling="no">
  </iframe>

  <!-- Input date -->
  <div class="date-input-wrapper">
    <label for="calendar">Dates :</label>
    <input type="text" id="calendar" placeholder="Vérifiez l'iframe pour les disponibilités" readonly>
  </div>

  <!-- Compteurs -->
  <div style="margin-top:15px;">
    <label>Adultes</label>
    <div class="counter">
      <button id="adultMinus">−</button>
      <span id="adultCount">2</span>
      <button id="adultPlus">+</button>
    </div>

    <label>Enfants</label>
    <div class="counter">
      <button id="childMinus">−</button>
      <span id="childCount">0</span>
      <button id="childPlus">+</button>
    </div>
    <p>Max 8 pers. (6 adultes max)</p>
  </div>

  <!-- Facturation -->
  <div id="billing" style="margin-top:10px;"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const billing = document.getElementById("billing");

  let adults = 2, children = 0;
  const NIGHT_PRICE = 140, CLEANING = 120, TAX_PER_ADULT = 1.5;
  const MIN_NIGHTS = 4, MAX_ADULTS = 6, MAX_TOTAL = 8;

  let startDate = null, endDate = null;

  // ==== Compteurs ====
  const adultCount = document.getElementById("adultCount");
  const childCount = document.getElementById("childCount");
  const adultMinus = document.getElementById("adultMinus");
  const adultPlus = document.getElementById("adultPlus");
  const childMinus = document.getElementById("childMinus");
  const childPlus = document.getElementById("childPlus");

  function updateButtons() {
    adultMinus.disabled = adults <= 1;
    adultPlus.disabled = adults >= MAX_ADULTS || adults + children >= MAX_TOTAL;
    childMinus.disabled = children <= 0;
    childPlus.disabled = adults + children >= MAX_TOTAL;
  }

  function changeAdult(n) {
    let val = adults + n;
    if(val < 1 || val > MAX_ADULTS || val + children > MAX_TOTAL) return;
    adults = val;
    adultCount.textContent = adults;
    updateButtons();
    updateBilling();
  }

  function changeChild(n) {
    let val = children + n;
    if(val < 0 || adults + val > MAX_TOTAL) return;
    children = val;
    childCount.textContent = children;
    updateButtons();
    updateBilling();
  }

  adultMinus.onclick = () => changeAdult(-1);
  adultPlus.onclick = () => changeAdult(1);
  childMinus.onclick = () => changeChild(-1);
  childPlus.onclick = () => changeChild(1);

  updateButtons();

  // ==== Facturation ====
  function updateBilling() {
    if(!billing) return;
    if(!startDate || !endDate) {
      billing.innerHTML = "";
      return;
    }

    const nights = Math.round((endDate - startDate)/(1000*60*60*24));
    if(nights < MIN_NIGHTS) {
      billing.innerHTML = `<p style="color:red;">Minimum ${MIN_NIGHTS} nuits</p>`;
      return;
    }

    const subtotal = nights * NIGHT_PRICE;
    const tax = adults * TAX_PER_ADULT;
    const total = subtotal + CLEANING + tax;

    billing.innerHTML = `
      <div class="billing-line"><span>${nights} nuits</span><span>${subtotal.toFixed(2)} €</span></div>
      <div class="billing-line"><span>Taxe séjour</span><span>${tax.toFixed(2)} €</span></div>
      <div class="billing-line"><span>Ménage</span><span>${CLEANING.toFixed(2)} €</span></div>
      <hr>
      <div class="billing-line total"><span>Total</span><span>${total.toFixed(2)} €</span></div>
    `;
    return total;
  }

  // ==== Flatpickr optionnel pour PC ====
  if(window.innerWidth > 768 && typeof flatpickr !== "undefined") {
    flatpickr("#calendar", {
      mode: "range",
      dateFormat: "d/m/Y",
      minDate: "today",
      onChange: function(selectedDates){
        if(selectedDates.length === 2){
          startDate = selectedDates[0];
          endDate = selectedDates[1];
          updateBilling();
        }
      }
    });
  }
});
</script>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/fr.js"></script>
</body>
</html>
