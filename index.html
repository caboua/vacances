<!-- HERO -->
<div class="hero">
  <div class="hero-overlay">
    <h1>Villa CABOUA</h1>
    <p>Location en Guadeloupe – Jusqu'à 8 voyageurs</p>
  </div>
</div>

<div class="container">

  <!-- GALERIE -->
  <div class="card">
    <h2>Galerie</h2>
    <div class="gallery">
      <img src="images/salon.jpeg">
      <img src="images/cuisine.jpeg">
      <img src="images/chambre1.jpeg">
      <img src="images/chambre2.jpeg">
      <img src="images/chambreparentale.jpeg">
      <img src="images/terrasse.jpeg">
    </div>
  </div>

  <!-- ÉQUIPEMENTS -->
  <div class="card">
    <h2>Équipements</h2>
    <div class="equipments">
      <div>✔ Wifi</div>
      <div>✔ Climatisation</div>
      <div>✔ Parking</div>
      <div>✔ 3 chambres</div>
      <div>✔ TV</div>
      <div>✔ Cuisine équipée</div>
    </div>
  </div>

  <!-- CALENDRIER -->
  <div class="card">
    <h2>Disponibilités</h2>

    <input id="calendar">

    <div class="billing" id="billing"></div>

    <div class="row">
      <div>
        <label>Adultes</label>
        <div class="counter">
          <button id="adultMinus">-</button>
          <span id="adultCount">2</span>
          <button id="adultPlus">+</button>
        </div>
      </div>

      <div>
        <label>Enfants</label>
        <div class="counter">
          <button id="childMinus">-</button>
          <span id="childCount">0</span>
          <button id="childPlus">+</button>
        </div>
      </div>
    </div>

    <button id="checkoutButton" class="btn">Réserver</button>
  </div>

</div>

<a href="#" class="whatsapp">
<i class="fa-brands fa-whatsapp"></i>
</a>
