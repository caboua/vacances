<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>Villa CABOUA – Location en Guadeloupe</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<header>
<div class="hero-content">
<h1>Villa CABOUA</h1>
<p>Location villa en Guadeloupe – Jusqu'à 8 voyageurs</p>
</div>
</header>

<div class="container">

<div class="booking-flex">

<div class="calendar-box">

<h2>Disponibilités</h2>

<iframe
src="https://calendar.google.com/calendar/embed?src=a42682891ff3cdeba7e8d30c8deb71cd3e263aaf9d3d84b61cc4efb52f5a2c75%40group.calendar.google.com&ctz=America%2FGuadeloupe"
style="border:0"
width="100%"
height="350"
frameborder="0"
scrolling="no">
</iframe>

<p><b>Sélectionnez vos dates</b></p>

<input id="calendar" placeholder="Choisir les dates">

<div id="billing"></div>

</div>

<div class="reservation-box">

<h3>140 € / nuit</h3>

<label>Adultes</label>

<div class="counter">
<button id="adultMinus">-</button>
<span id="adultCount">2</span>
<button id="adultPlus">+</button>
</div>

<label>Enfants</label>

<div class="counter">
<button id="childMinus">-</button>
<span id="childCount">0</span>
<button id="childPlus">+</button>
</div>

<p>Maximum 8 personnes</p>

<button id="checkoutButton">Réserver</button>

</div>

</div>

</div>

<a
href="https://wa.me/590690520616?text=Bonjour%20je%20souhaite%20des%20informations%20sur%20la%20Villa%20CABOUA"
class="whatsapp-float"
target="_blank">

<i class="fa-brands fa-whatsapp"></i>

</a>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/fr.js"></script>

<script src="js/main.js"></script>

</body>
</html>
