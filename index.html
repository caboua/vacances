<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<!-- 🔥 EMPÊCHE ZOOM -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Villa CABOUA – Location en Guadeloupe</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<header>
  <div class="hero-content">
    <h1>Villa CABOUA</h1>
    <p>Location villa en Guadeloupe – Jusqu'à 8 voyageurs</p>
    <a href="#disponibilites" class="hero-btn">Vérifier les disponibilités</a>
  </div>
</header>

<div class="container">

<div class="left">

<div class="section">
<h2>Description</h2>
<p>Villa moderne située en Guadeloupe, idéale pour un séjour en famille.</p>
</div>

<div class="section">
<h2>Galerie</h2>
<div class="gallery">
<img src="images/salon.jpeg">
<img src="images/cuisine.jpeg">
<img src="images/chambre1.jpeg">
<img src="images/chambre2.jpeg">
<img src="images/chambreparentale.jpeg">
<img src="images/terrasse.jpeg">
</div>
</div>

<div class="section" id="disponibilites">
<h2>Disponibilités</h2>

<iframe
src="https://calendar.google.com/calendar/embed?src=a42682891ff3cdeba7e8d30c8deb71cd3e263aaf9d3d84b61cc4efb52f5a2c75%40group.calendar.google.com&ctz=America%2FGuadeloupe"
style="border:0;width:100%;height:400px;">
</iframe>

<label>Dates</label>
<input id="calendar" placeholder="Cliquez pour choisir les dates">

<div id="billing"></div>

<label>Adultes</label>
<div class="counter">
<button id="adultMinus">−</button>
<span id="adultCount">2</span>
<button id="adultPlus">+</button>
</div>

<label>Enfants</label>
<div class="counter">
<button id="childMinus">−</button>
<span id="childCount">0</span>
<button id="childPlus">+</button>
</div>

<button id="checkoutButton">Réserver maintenant</button>

</div>

</div>

</div>

<div id="reservationModal" class="modal">
<div class="modal-content">
<span class="close">&times;</span>
<h2>Confirmer</h2>
<p id="reservationSummary"></p>
<button id="confirmBooking">Confirmer</button>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="js/main.js"></script>

</body>
</html>
