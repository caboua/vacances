<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Villa CABOUA – Location en Guadeloupe</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<header>
  <div class="hero-content">
    <h1>Villa CABOUA</h1>
    <p>Location villa en Guadeloupe – Jusqu'à 8 voyageurs</p>
    <a href="#disponibilites" class="hero-btn">Vérifier les disponibilités</a>
  </div>
</header>

<div class="container">
  <div class="left">

    <!-- DESCRIPTION -->
    <div class="section">
      <h2>Description</h2>
      <p>Villa moderne située en Guadeloupe, idéale pour un séjour en famille.</p>
    </div>

    <!-- GALERIE -->
    <div class="section">
      <h2>Galerie</h2>
      <div class="gallery">
        <img src="images/salon.jpeg">
        <img src="images/cuisine.jpeg">
        <img src="images/chambre1.jpeg">
        <img src="images/chambre2.jpeg">
        <img src="images/chambreparentale.jpeg">
        <img src="images/terrasse.jpeg">
      </div>
    </div>

    <!-- EQUIPEMENTS -->
    <div class="section">
      <h2>Équipements</h2>
      <div class="equip-grid">
        <div><i class="fa fa-wifi"></i> Wifi</div>
        <div><i class="fa fa-snowflake"></i> Climatisation</div>
        <div><i class="fa fa-car"></i> Parking</div>
        <div><i class="fa fa-tv"></i> TV</div>
      </div>
    </div>

    <!-- DISPONIBILITES -->
    <div class="section" id="disponibilites">
      <h2>Disponibilités</h2>

      <iframe
        src="https://calendar.google.com/calendar/embed?src=ds98qjiuc1uqumr9dc1nnaoag24pqfsa%40import.calendar.google.com&ctz=America%2FGuadeloupe"
        style="border:0"
        width="100%"
        height="400"
      ></iframe>

      <br><br>

      <input id="calendar" placeholder="Choisir dates">

      <div id="billing"></div>

      <div class="counter">
        <button id="adultMinus">-</button>
        <span id="adultCount">2</span>
        <button id="adultPlus">+</button>
      </div>

      <div class="counter">
        <button id="childMinus">-</button>
        <span id="childCount">0</span>
        <button id="childPlus">+</button>
      </div>

      <p>Max 8 personnes</p>

      <button id="checkoutButton">Réserver</button>

    </div>

  </div>
</div>

<!-- WHATSAPP -->
<a href="https://wa.me/590690000000" class="whatsapp">
<i class="fa-brands fa-whatsapp"></i>
</a>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/fr.js"></script>

<script src="js/main.js"></script>

</body>
</html>
